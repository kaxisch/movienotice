<p class="synopsis">故事從都市原住民青少年劉力臣與蘇靜雯的拳擊人生開始。力臣天賦異稟，國中即拿下全國冠軍，卻在升上高中後陷入迷惘——拳擊、升學、原住民身分，哪一個才是他該走的路？在他迷惘的同時，他的拳擊成績逐步下滑，重創他的信心。靜雯則來自新北三峽南靖部落，被看好成為下一個世代的奧運拳擊選手，心裡對於拳擊充滿了不確定性，繼續練拳的唯一理由是所有人的期待。都市部落出身的她，卻在都市中找不到家的歸屬感。</p>
