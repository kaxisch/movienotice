<p class="synopsis">由長谷川奈央主演 河合夕子，是個在東京都內廣告代理商工作的28歲平凡女性，沒有男朋友、沒有存款，也無望升遷。夕子在面對前途未明的人生時，偶然遇到神祕男子並進行了「影子交易」——只要賣掉自己的影子，就能在一年內心想事成、實現所有願望。然而，在追求一夜暴富與幸福的背後，卻必須承受意想不到的沉重代價與危機。</p>
