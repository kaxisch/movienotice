<p class="synopsis">她是婚紗照迷妹，卻拍出一組失敗的婚紗照，帶著鬱悶踏上追星之旅，只為找答案：「什麼才是好婚紗照？」她走訪「中視新娘世界」創始地，一窺婚紗教父魏朝福的夢幻與現實，理解林聲永的叛逆不羈，也揭開英奇鏡頭下的傷痕。她在他們的故事裡回望自己，看見身為女性在每個人生階段的缺憾，以及那個永遠無法觸碰的完滿。</p>
