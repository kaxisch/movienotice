<p class="synopsis">《超人再起》是《台灣超人》系列的最終篇章。當你看見消防員 余泰運 在高雄氣爆重傷後，忍痛復健，重新穿上那件沉重的消防衣；當你看見楊川輝 在一夕之間失去視力與聽力，卻不放棄在黑暗中一次次起跑，直到衝過亞洲紀錄。還有好多好多超人的故事，都在這部電影之中。你或許會想起生命裡那些「不知道還能不能撐下去」的漫長黑夜，也慢慢開始相信，只要願意不斷往前，路自然會出現。</p>
