<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta name="description" content="台灣上映電影資訊">  
<meta name="google-site-verification" content="JG9b85go-hJgyT-dPYVUOa8BosboH2BhpdhtPE3f-do" />  
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, user-scalable=no" name="viewport"/>
<title>MovieNotice｜電影佈告欄</title>
<link rel="icon" href="favicon.ico" sizes="32x32"/>
<link rel="icon" href="apple-touch-icon.png" type="image/png"/>
<link rel="icon" href="favicon.svg" type="image/svg+xml" sizes="any"/>
<link rel="apple-touch-icon" href="apple-touch-icon.png"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="電影佈告欄"/>
<link rel="manifest" href="/manifest.webmanifest"/>
<meta name="theme-color" content="#0a0a0f"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..400,0..1&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="styles.css"/>
</head>
<body>

<div class="glow-fixed glow-yellow"></div>
<div class="glow-fixed glow-blue"></div>

<header id="navbar">
  <div class="nav-inner">
    <div class="nav-logo">
      <img src="logo.svg" width="171" height="40" alt="MovieNotice 電影佈告欄"/>
      <span>電影佈告欄</span>
    </div>
  </div>
</header>

<div id="tab-bar">
  <div class="tab-bar-inner">
    <div class="tabs">
      <button class="tab-btn" id="tab-now" onclick="switchTab('now')">現正熱映</button>
      <button class="tab-btn" id="tab-soon" onclick="switchTab('soon')">即將上映</button>
      <span id="movie-count" style="margin-left:0px; color:#888; font-size:13px; align-self:flex-end; padding-bottom:7px;"></span>
      <div id="tab-indicator"></div>
    </div>
    <div class="filter-row">
      <button id="mobile-search-toggle" onclick="toggleFilter()">
        <span class="material-symbols-outlined" style="font-size:18px">search</span>尋找
      </button>
      <div class="filter-left-group">
        <div class="tab-search-wrap">
          <span class="material-symbols-outlined search-icon-abs" style="font-size:18px;color:rgba(255,255,255,0.4)">search</span>
          <input id="tab-search" class="tab-search" type="text" placeholder="搜尋電影..."/>
          <button class="search-clear-btn" id="tab-search-clear" onclick="clearSearch()"><span class="material-symbols-outlined" style="font-size:18px">cancel</span></button>
        </div>
        <div class="sort-wrap">
          <span class="material-symbols-outlined" style="font-size:20px">sort</span>
          <select id="sort-select" class="sort-select" onchange="sortMovies()">
            <option value="date_desc">上映日期 ↓</option>
            <option value="date_asc">上映日期 ↑</option>
            <option value="imdb_desc">IMDb ↓</option>
            <option value="imdb_asc">IMDb ↑</option>
            <option value="tmdb_desc">TMDB ↓</option>
            <option value="tmdb_asc">TMDB ↑</option>
          </select>
        </div>
      </div>
      <div class="filter-right-group">
        <div class="divider-v filter-desktop-divider"></div>
        <button class="filter-btn" onclick="toggleFilter(this)">
          <span class="material-symbols-outlined" style="font-size:16px">tune</span>篩選
        </button>
        <div class="active-filters-display">
          <span id="active-filters-text" class="active-filters-text"></span>
        </div>
        <button id="clear-all-filters-btn" class="clear-active-btn" onclick="clearFilters()">
          <span class="material-symbols-outlined" style="font-size:14px">close</span>
        </button>
      </div>
      <div class="view-toggle">
        <div class="divider-v view-divider-desktop"></div>
        <button id="btn-view-card" class="view-btn active" onclick="setView('card')" title="卡片模式">
          <span class="material-symbols-outlined" style="font-size:20px">grid_view</span>
        </button>
        <button id="btn-view-list" class="view-btn" onclick="setView('list')" title="列表模式">
          <span class="material-symbols-outlined" style="font-size:20px">view_list</span>
        </button>
      </div>
    </div>
    <div id="mobile-active-bar">
      <span id="mobile-active-bar-text"></span>
      <button class="clear-active-btn" onclick="clearFilters()">
        <span class="material-symbols-outlined" style="font-size:14px">close</span>
      </button>
    </div>
    <div id="filter-panel">
      <div id="mobile-search-wrap" class="tab-search-wrap">
        <span class="material-symbols-outlined search-icon-abs" style="font-size:18px;color:rgba(255,255,255,0.4)">search</span>
        <input id="mobile-tab-search" class="tab-search" type="text" placeholder="搜尋電影..."/>
        <button class="search-clear-btn" id="mobile-search-clear" onclick="clearMobileSearch()"><span class="material-symbols-outlined" style="font-size:18px">cancel</span></button>
      </div>
      <div class="filter-groups">
        <div>
          <p class="filter-group-label">類型</p>
          <div class="filter-tags" id="genre-filters"></div>
        </div>
        <div>
          <p class="filter-group-label">最低評分</p>
          <select id="min-rating-select" class="rating-select" onchange="applyFilters()">
            <option value="0">不限</option>
            <option value="6">6 分以上</option>
            <option value="7">7 分以上</option>
            <option value="8">8 分以上</option>
          </select>
        </div>
      </div>
      <div class="filter-panel-bottom">
        <button class="clear-btn" onclick="clearFilters()">
          <span class="material-symbols-outlined" style="font-size:20px">close</span>清除篩選
        </button>
        <button class="close-filter-btn" onclick="toggleFilter()">
          <span class="material-symbols-outlined" style="font-size:20px">keyboard_arrow_up</span>
        </button>
      </div>
    </div>
  </div>
</div>

<div class="content-area">
  <div id="error-banner"></div>
  <div class="tab-content" id="content-now">
    <div class="movie-grid" id="grid-now"></div>
    <p class="empty-msg" id="empty-now">沒有符合條件的電影</p>
  </div>
  <div class="tab-content" id="content-soon">
    <div class="movie-grid" id="grid-soon"></div>
    <p class="empty-msg" id="empty-soon">沒有符合條件的電影</p>
  </div>
</div>

<div id="detail-modal">
  <div class="modal-backdrop" onclick="closeModal()"></div>
  <div class="modal-scroll">
    <div id="modal-bg-fill"></div>
    <div id="modal-hero-slot"></div>
    <div class="modal-inner">
      <button class="modal-close" onclick="closeModal()">
        <span class="material-symbols-outlined" style="font-size:20px;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24">close</span>
      </button>
      <div id="modal-content"></div>
    </div>
  </div>
</div>

<div id="trailer-modal">
  <div class="trailer-backdrop" onclick="closeTrailer()"></div>
  <div class="trailer-wrap">
    <button class="trailer-close" onclick="closeTrailer()">
      <span class="material-symbols-outlined" style="font-size:18px">close</span>關閉
    </button>
    <iframe id="trailer-iframe" src="" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin"></iframe>
  </div>
</div>

<div class="content-area footer-status-wrap">
  <div id="data-status" class="nav-refresh-btn footer-status" aria-live="polite">
    <span class="material-symbols-outlined data-status-icon">schedule</span>
    <span class="refresh-label">載入資料中</span>
  </div>
</div>

<footer style="padding:40px 64px;border-top:1px solid rgba(255,255,255,0.05);text-align:center;margin-top:-8px;">
  <p style="color:rgba(255,255,255,0.3);font-size:12px;font-weight:300">MovieNotice · 資料來源 TMDB、OMDb（含 IMDb、爛番茄、Metacritic 評分）· made by Axis Chang</p>
</footer>

<script src="app.js"></script>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js')
      .then(reg => console.log('[SW] registered:', reg.scope))
      .catch(err => console.warn('[SW] register failed:', err));
  }
</script>
</body>
</html>
