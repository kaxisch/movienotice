name: Refresh Website from TMDB

on:
  schedule:
    # Recheck Google Sheet candidates against TMDB every three hours.
    - cron: "37 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: movienotice-data-jobs
  cancel-in-progress: false

jobs:
  refresh-site:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Save previous site data
        run: git show HEAD:data/movie-data.json > /tmp/previous-movie-data.json

      - name: Refresh TMDB-verified site data
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          OMDB_API_KEYS: ${{ secrets.OMDB_API_KEYS }}
          MDBLIST_API_KEY: ${{ secrets.MDBLIST_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
        run: python3 scripts/refresh_site_from_google_sheet.py

      - name: Validate generated site data
        run: python3 scripts/validate_movie_data.py --previous-movie-data /tmp/previous-movie-data.json

      - name: Generate movie detail pages
        run: python3 scripts/generate_movie_pages.py

      - name: Commit refreshed site data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/movie-data.json data/tw-whitelist.json movies movie-page.css sitemap.xml
          if git diff --cached --quiet; then
            echo "No site data changes to commit."
          else
            git commit -m "Refresh TMDB-verified movie data"
            git push origin main
          fi
