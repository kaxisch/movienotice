name: Weekly MovieNotice Check

on:
  schedule:
    # 09:00 Asia/Taipei every Wednesday and Saturday.
    - cron: "0 1 * * 3,6"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  weekly-check:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run weekly crawler
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          OMDB_API_KEYS: ${{ secrets.OMDB_API_KEYS }}
        run: python3 scripts/weekly_check.py

      - name: Publish TSV to Google Sheets
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          GOOGLE_DRIVE_FOLDER_NAME: ${{ vars.GOOGLE_DRIVE_FOLDER_NAME || 'tw movie' }}
          GOOGLE_SPREADSHEET_NAME: ${{ vars.GOOGLE_SPREADSHEET_NAME || 'movienotice_weekly' }}
        run: python3 scripts/publish_to_google_sheet.py
