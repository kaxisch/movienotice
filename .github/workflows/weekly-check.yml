name: Weekly MovieNotice Check

on:
  schedule:
    # 09:31 Asia/Taipei every Wednesday and Saturday.
    - cron: "31 1 * * 3,6"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  weekly-check:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Save previous site data
        run: git show HEAD:data/movie-data.json > /tmp/previous-movie-data.json

      - name: Run weekly crawler
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          OMDB_API_KEYS: ${{ secrets.OMDB_API_KEYS }}
        run: python3 scripts/weekly_check.py

      - name: Validate generated site data
        run: python3 scripts/validate_movie_data.py --previous-movie-data /tmp/previous-movie-data.json

      - name: Generate movie detail pages
        run: python3 scripts/generate_movie_pages.py

      - name: Publish TSV to Google Sheets
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          GOOGLE_DRIVE_FOLDER_NAME: ${{ vars.GOOGLE_DRIVE_FOLDER_NAME || 'tw movie' }}
          GOOGLE_SPREADSHEET_NAME: ${{ vars.GOOGLE_SPREADSHEET_NAME || 'movienotice_weekly' }}
        run: python3 scripts/publish_to_google_sheet.py

      - name: Commit updated site data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/movie-data.json data/tw-whitelist.json data/atmovies-candidates.json data/atmovies-next-snapshot.json data/atmovies-next-diff.json movies movie-page.css sitemap.xml
          if git diff --cached --quiet; then
            echo "No site data changes to commit."
          else
            git commit -m "Update weekly movie data"
            git push origin main
          fi
